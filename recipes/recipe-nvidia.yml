---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: mrrobot-custom-fedora-sway-nvidia
description: Personal OS image - Nvidia
base-image: ghcr.io/wayblueorg/sway-nvidia-open
# Pinned to Fedora 44: COPR/Terra packages are built per-release, so bumping
# this needs re-verifying every package builds for the new release first.
image-version: "44"
modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - atim/starship
        - scottames/ghostty
        - swayfx/swayfx
        - wezfurlong/wezterm-nightly
    install:
      packages:
        # --- repos / editors -------------------------------------------------
        - terra-release
        - zed
        - micro
        - starship
        - ghostty
        - neovim
        - git
        # SwayFX replaces the base 'sway' package — see the 'replace:' block below
        # (swayfx Provides/Conflicts sway, so it can't just be added alongside).
        # --- terminals & shells ----------------------------------------------
        - wezterm
        - zsh
        - nushell
        # ====================================================================
        # DESKTOP SHELL — choose ONE at runtime (both installed; switch via your
        # Sway config, not here):
        #   OPTION A (default): Noctalia — own bar/notifications/launcher/lock.
        #     Autostart ONLY Noctalia; don't also start waybar/mako/fuzzel.
        #   OPTION B: classic Sway stack (waybar+mako+fuzzel+swaylock) if not
        #     using Noctalia.
        # No package conflict; only autostarting both conflicts (your config).
        # ====================================================================
        # -- Option A: Noctalia shell --
        - noctalia-shell        # Noctalia (+noctalia-qs runtime), from Terra
        # -- Option B: classic Sway shell pieces (Noctalia replaces these) --
        # - waybar                #   status bar        (Noctalia replaces)  (in base image)
        - mako                  #   notifications     (Noctalia replaces)
        - fuzzel                #   app launcher      (Noctalia replaces)
        # - swaylock              #   screen locker     (Noctalia replaces)  (in base image)
        # --- low-level helpers Noctalia does NOT replace (keep for both) ------
        # - swayidle              # idle detection -> triggers the lock screen  (in base image)
        # - swaybg                # wallpaper  (in base image)
        # - kanshi                # display/output config  (in base image)
        # - grim   # in WayBlue base image
        # - slurp   # in WayBlue base image
        - flameshot
        # - brightnessctl         # backend for Noctalia's brightness slider  (in base image)
        # - playerctl             # backend for Noctalia's media controls  (in base image)
        # - pamixer               # backend for Noctalia's volume slider  (in base image)
        # - wl-clipboard   # in WayBlue base image
        # - network-manager-applet   # in WayBlue base image
        # - blueman   # in WayBlue base image
        # --- file manager ----------------------------------------------------
        # - thunar   # in WayBlue base image
        # - thunar-volman   # in WayBlue base image
        # - tumbler   # in WayBlue base image
        # - gvfs   # in WayBlue base image
        # - udisks2   # in WayBlue base image
        # --- utilities & power -----------------------------------------------
        # - 7zip   # in WayBlue base image
        # --- terminal fun ----------------------------------------------------
        - cowsay
        - cbonsai
        - proxychains-ng
        - asciiquarium
        # --- fonts (Nerd Fonts come from install-nerdfonts.sh) ----------------
        - fira-code-fonts
        - jetbrains-mono-fonts
        # - fontawesome-6-free-fonts   # in WayBlue base image
        # --- containers ------------------------------------------------------
        # - podman   # in WayBlue base image
        - podman-compose
        # - distrobox   # in WayBlue base image
        # --- virtualization --------------------------------------------------
        - libvirt
        - virt-manager
        - virt-viewer
        - qemu-kvm
        # --- security / VPN --------------------------------------------------
        # - wireguard-tools   # in WayBlue base image
        - clamav
        - clamav-freshclam
        - pass
        # - gnome-keyring   # in WayBlue base image
        # --- hardware --------------------------------------------------------
        - solaar
        - logiops
        # --- smartcard / yubikey ---------------------------------------------
        - yubikey-manager
        # - gnupg2-scdaemon   # in WayBlue base image
        # - libatomic   # in WayBlue base image
        # - pcsc-lite   # in WayBlue base image
        # - pcsc-lite-ccid   # in WayBlue base image
        - pam-u2f
        # - libfido2   # in WayBlue base image
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - opensc
        - opensc-libs
    # Swap the base WayBlue 'sway' for 'swayfx' (rounded corners/blur/shadows).
    # swayfx Provides sway, so dependents stay satisfied; allow-erasing lets it
    # remove the conflicting base sway package.
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:swayfx:swayfx
        allow-erasing: true
        packages:
          - old: sway
            new: swayfx
  # Scripts run AFTER dnf so git + the Terra repo (terra-release) are available.
  # NetBird is installed by script (its rpm %post broke the image build).
  - type: script
    scripts:
      - install-netbird.sh
      - install-protonvpn-cli.sh
      - install-helium.sh
      - install-waveterm.sh
      - install-nerdfonts.sh
      - install-unix-setup.sh
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.brave.Browser
          - app.zen_browser.zen
          - com.bitwarden.desktop
          - org.keepassxc.KeePassXC
          - md.obsidian.Obsidian
          - org.signal.Signal
          - org.localsend.localsend_app
          - org.cryptomator.Cryptomator
          - ch.protonmail.protonmail-bridge
          - one.flipperzero.qFlipper
          - com.spotify.Client
          - org.videolan.VLC
          - com.calibre_ebook.calibre
          - io.github.flattool.Warehouse
          - com.github.tchx84.Flatseal
      - scope: user
  - type: systemd
    system:
      enabled:
        - libvirtd.service
        - clamav-freshclam.service
        - fstrim.timer
        - mrrobot-firewall.service
        - mrrobot-vm-render.service
  - type: signing
